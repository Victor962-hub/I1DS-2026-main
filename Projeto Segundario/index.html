<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Dark Mode / Light Mode</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Bem-vindo!</h1>

</div>
